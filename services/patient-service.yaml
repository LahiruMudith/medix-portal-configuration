spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:12500/cms
    username: postgres
    password: psql
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
servlet:
  multipart:
    enabled: true
    max-file-size: 10MB
    max-request-size: 10MB
server:
  port: 8000
  forward-headers-strategy: framework
app:
  storage:
    path: ${user.home}/.cms/patients
